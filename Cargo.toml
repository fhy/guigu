[package]
name = "guigu"
version = "0.1.0"
edition = "2024"

description = "A lightweight Rust-native AI Agent runtime"
license = "MIT"
repository = "https://github.com/fhy/guigu"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"
