[package]
name = "guigu"
version = "0.1.0"
edition = "2024"

description = "A lightweight Rust-native AI Agent runtime"
license = "MIT"
repository = "https://github.com/fhy/guigu"

[features]
default = ["providers-http"]
providers-http = ["dep:reqwest"]
# Task 014：ACP SSE+HTTP 传输（多 client，可选加分项）。默认不含；stdio 为必做 DoD。
# 本任务降级为后续（`serve_sse` 存根），启用后需补 axum/reqwest 依赖与实现。
acp-sse = []

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"
# Optional：真实 LLM HTTP 适配器（OpenAI / Anthropic）。
# 嵌入方 `default-features = false` 可剥离 reqwest，得到纯核心库。
# 本构建环境无 OpenSSL 头文件，故用 rustls（纯 Rust）替代默认 native-tls。
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"], optional = true }

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
# Task 009：session JSONL 集成测试的临时目录。
tempfile = "3"

[[bin]]
name = "guigu"
path = "src/bin/main.rs"
