[package]
name = "guigu"
version = "0.1.0"
edition = "2024"

description = "A lightweight Rust-native AI Agent runtime"
license = "MIT"
repository = "https://github.com/fhy/guigu"
readme = "README.md"
keywords = ["ai-agent", "agent", "llm", "async", "runtime"]
categories = ["asynchronous", "command-line-utilities", "network-programming"]
# 发布包只含运行/构建所需文件；排除 docs/（内部任务板、审查报告等开发文档）。
# 模式加前导 / 锚定到包根目录：Cargo 的 include glob 默认在任意深度匹配，
# 不加 / 会误收 .opencode/node_modules/*/src|tests|README|LICENSE|CHANGELOG。
include = [
    "/src/",
    "/tests/",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[features]
# Task 022：`config` 加入 default——toml 极轻（纯 serde 解析、无 TLS/系统依赖），
# CLI 自定义模型配置应开箱即用（`cargo install guigu` 默认可用），且 default
# `cargo test` 需覆盖配置解析（对标 007 `providers-http` default 的测试覆盖理由）。
default = ["providers-http", "config"]
providers-http = ["dep:reqwest"]
# Task 022：TOML 配置文件解析（`Config::load`/`resolve`）。数据结构
# （`ModelConfig`/`Protocol`/`GuiguConfig`）不 gate，仅 TOML 解析 gate 在此。
config = ["dep:toml"]
# Task 025：ACP SSE+HTTP 传输（多 client）。默认不含（axum/tokio-stream 编译面大，
# 保持 default 精简）；需要远程多 client 时显式 `--features acp-sse`。
acp-sse = ["dep:axum", "dep:tokio-stream"]
# Task 023：全屏 TUI（ratatui + crossterm）。**非 default（opt-in）**：ratatui/
# crossterm 依赖树/编译面明显重于 toml/reqwest，保持 default 精简、降低嵌入方与
# `cargo install guigu` 的默认编译负担；需要 TUI 时显式 `--features tui`。
tui = ["dep:ratatui", "dep:crossterm"]

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"
# Task 015：正式 CLI（clap derive）。
clap = { version = "4", features = ["derive"] }
# Optional：真实 LLM HTTP 适配器（OpenAI / Anthropic）。
# 嵌入方 `default-features = false` 可剥离 reqwest，得到纯核心库。
# 本构建环境无 OpenSSL 头文件，故用 rustls（纯 Rust）替代默认 native-tls。
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"], optional = true }
# Task 025：ACP SSE+HTTP 传输（feature `acp-sse`，非 default）。axum 提供 HTTP
# server + SSE 响应；tokio-stream 提供 mpsc → Stream 适配（axum `Sse` 需要）。
axum = { version = "0.8", optional = true }
tokio-stream = { version = "0.1", optional = true }
# Task 022：TOML 配置文件解析（feature `config`，default 开启）。纯 serde 解析，
# 无 TLS/系统依赖；嵌入方 `default-features = false` 可剥离。
toml = { version = "0.8", optional = true }
# Task 023：全屏 TUI（feature `tui`，非 default）。ratatui 提供终端 UI 渲染
# （含 `TestBackend` 无头测试），crossterm 提供终端事件/原始模式抽象。均 optional，
# 嵌入方 `default-features = false` 或不开 `tui` 即可剥离。
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
# Task 009：session JSONL 集成测试的临时目录。
tempfile = "3"
# Task 025：SSE 集成测试的客户端（仅 dev，不进入运行时依赖；服务端无客户端 HTTP 需求）。
# 同 [dependencies] 用 rustls（本环境无 OpenSSL 头文件）。
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
# Task 025：SSE 流读取的字节类型（reqwest `bytes_stream` 的 item 类型；已在依赖树中）。
bytes = "1"

[[bin]]
name = "guigu"
path = "src/bin/guigu/main.rs"
# CLI 二进制装配真实 LLM provider（`guigu::adapters`，由 `providers-http` 门控）
# + TOML 配置加载（`guigu::config::Config`，由 `config` 门控），故缺任一 feature
# 的构建不构建该 target，使 `cargo test --no-default-features` 仅编译 lib + 集成
# 测试（Task 025 feature 矩阵验收；Task 022 追加 `config`）。
required-features = ["providers-http", "config"]
